title: Software Engineer
headline: Software Engineer especializado em front-end, design systems e performance.

# A palavra em `emphasis` é destacada em serifa itálica no título principal.
heroStatement:
  lead: Construo produtos digitais que
  emphasis: escalam
  trail: para milhares de pessoas.

heroIntro: >-
  Construo produtos SaaS que milhares de pessoas usam para trabalhar todos os dias.
  Cinco anos entre React, TypeScript e design systems — com obsessão por interfaces
  rápidas, acessíveis e fáceis de manter.

bio:
  - >-
    Sou desenvolvedor há mais de cinco anos e passei quase todos eles dentro de produtos
    SaaS reais: sistemas fiscais, financeiros e logísticos usados diariamente por
    produtores rurais, transportadoras e escritórios de contabilidade em todo o Brasil.
    É um contexto que não perdoa interface lenta nem fluxo confuso — se a emissão de um
    documento falha, o caminhão não sai.
  - >-
    Meu trabalho vai além de entregar telas. Fui responsável pela manutenção de dois
    design systems usados por múltiplos produtos, liderei a migração de Next.js para
    Vite reduzindo custos de infraestrutura, e derrubei o tempo de deploy de 25 para 4
    minutos. Gosto de atacar o que trava o time inteiro, não só a minha própria task.
  - >-
    Sou bacharel em Ciência da Computação pela Atitus Educação, onde conduzi uma
    pesquisa sobre a viabilidade de executar grandes modelos de IA diretamente em
    dispositivos móveis. Hoje atuo como desenvolvedor de sistemas na Sicredi Aliança,
    construindo APIs em Python/FastAPI e automatizando rotinas via API e RPA para reduzir
    trabalho manual dos setores da sede — em paralelo a um produto próprio de gestão
    escolar que estou construindo com dois sócios.

