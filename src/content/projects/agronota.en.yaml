title: AgroNota

role: Front-end Developer

summary: >-
  Web and mobile system for issuing NFP-e, generating the Livro Caixa (cash book) and
  LCDPR filings for rural producers, accounting offices, unions and cooperatives. I worked
  on the product's front-end for four years, from the issuance flow to the reconciliation
  and reporting screens.

cover:
  alt: AgroNota home screen showing the tax-filing platform for rural producers.
tagline: >-
  Tax and financial platform that turned rural producers' accounting close
  into a matter of minutes.

problem: >-
  Rural tax closing in Brazil is one of the most bureaucratic processes there is: NFP-e
  documents issued through different state government portals, Funrural, forward-delivery
  sales, activity-based cost allocation, and the mandatory LCDPR filing. Accounting offices
  spent the entire month entering documents manually, one producer at a time, with a high
  risk of error and rework when it came time to file with the Federal Revenue Service.

solution: >-
  We built a product that fetches documents directly from SEFAZ in real time and applies a
  rule set that automatically classifies each entry — reaching 95% of the cash book and
  LCDPR filings generated with no human intervention. On the front-end, that meant
  extremely dense data screens (tables with thousands of rows, batch editing, OFX
  reconciliation) that still had to stay responsive, plus a field-issuance app built for a
  connection that doesn't always cooperate.

challenges:
  - >-
    Rendering fiscal tables with thousands of entries without freezing the interface —
    solved with virtualization, server-side pagination and careful memoization of derived
    state.
  - >-
    Modeling tax forms with dozens of interdependent fields and conditional validation,
    while keeping them testable and readable with React Hook Form and Zod.
  - >-
    Keeping visual and behavioral consistency between AgroNota and the company's other
    products, consuming the same design system without forcing it to fit the specific
    needs of the tax domain.
  - >-
    Sustaining legacy code while new features kept shipping, without freezing the roadmap
    or quietly piling up technical debt.

results:
  - value: 7,100+
    label: active customers
    detail: Producers, accounting offices, unions and cooperatives
  - value: 95%
    label: of the cash book automated
    detail: Cash book and tax ledger generated by rules, with no manual entry
  - value: 735h
    label: saved per month
    detail: Reduction reported by a single client accounting office
